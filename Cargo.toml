[package]
name = "cranpose-build"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
description = "Build, package and run Cranpose apps across desktop and mobile platforms"
repository = "https://github.com/samoylenkodmitry/cranpose-build"
default-run = "cranpose-build"

[workspace]
members = ["xtask"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
plist = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tempfile = "3"
ctrlc = "3"
ureq = { version = "3.4", features = ["json"] }
cranpose-plugin-process = { git = "https://github.com/samoylenkodmitry/cranpose-intellij-plugin-template", rev = "944c68abaf1d0a15a105b67a600ea1dadf6a36f1" }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"

[profile.dev]
debug = 0
[profile.release]
strip = true
